services:
  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: codexlab-website
    container_name: codexlab-website
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: frontend/.env.local
        required: false
    restart: unless-stopped
